apiVersion: batch/v1
kind: CronJob
metadata:
  name: order-auto-reject
  namespace: deliver-eats
  labels:
    app.kubernetes.io/name: order-auto-reject
    app.kubernetes.io/part-of: deliver-eats
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: order-auto-reject
            app.kubernetes.io/part-of: deliver-eats
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: artifact-registry-pull-secret
          containers:
            - name: order-auto-reject
              image: us-central1-docker.pkg.dev/saproyecto-494423/deliver-eats-repo/order-service:latest
              imagePullPolicy: Always
              env:
                - name: AUTO_REJECT_ONCE
                  value: "true"
                - name: AUTO_REJECT_MINUTES
                  value: "60"
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: DB_HOST
                - name: DB_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: DB_PORT
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: DB_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: ORDER_DB_NAME
                - name: DB_WINDOWS_AUTH
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: DB_WINDOWS_AUTH
                - name: USER_SERVICE_ADDR
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: USER_SERVICE_ADDR
                - name: NOTIFICATION_SERVICE_ADDR
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: NOTIFICATION_SERVICE_ADDR
